<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argonvia Campo</title>
<meta name="theme-color" content="#232323">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
/* Layout: uma coluna para telemóvel, barra superior escura com o verde Argonvia, cartões só onde há um bloco a preencher,
   resultados fixos no fundo do ecrã. Contraste alto para ler ao sol. */
:root {
  --bg: #f4f5ef; --card: #ffffff; --fg: #1c1d1a; --muted: #5b5c60; --line: #c9cac2; --soft: #e8eadb;
  --brand: #b2bd21; --brand-ink: #4f5600; --bar: #232323; --bar-fg: #ffffff;
  --ok: #17703f; --ok-bg: #dcf1e3; --bad: #b42318; --bad-bg: #fde3df; --warn: #8a5a00; --warn-bg: #fff1cf;
  --focus: #2b6cd6;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-num: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141512; --card: #1f201c; --fg: #f1f2ea; --muted: #a9aaa2; --line: #3c3e36; --soft: #2a2c24;
  --brand: #c3cf2c; --brand-ink: #d9e46a; --bar: #0b0b0a; --bar-fg: #f1f2ea;
  --ok: #6fd69a; --ok-bg: #173323; --bad: #ff8a7a; --bad-bg: #3d1712; --warn: #f2c45a; --warn-bg: #3a2c0b;
  --focus: #7fb0ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141512; --card: #1f201c; --fg: #f1f2ea; --muted: #a9aaa2; --line: #3c3e36; --soft: #2a2c24;
  --brand: #c3cf2c; --brand-ink: #d9e46a; --bar: #0b0b0a; --bar-fg: #f1f2ea;
  --ok: #6fd69a; --ok-bg: #173323; --bad: #ff8a7a; --bad-bg: #3d1712; --warn: #f2c45a; --warn-bg: #3a2c0b;
  --focus: #7fb0ff; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--f-ui); -webkit-text-size-adjust: 100%;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-fg);
  border-bottom: 3px solid var(--brand); }
.topo-in { display: flex; align-items: center; gap: 10px; min-height: 56px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.topo h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo h1 small { display: block; font-size: 12px; font-weight: 400; color: color-mix(in srgb, var(--bar-fg) 70%, transparent); }
.marca { font-weight: 700; letter-spacing: .02em; }
.marca b { color: var(--brand); font-weight: 700; }
.btn-topo { background: transparent; border: 0; color: var(--bar-fg); font-size: 26px; width: 44px; height: 44px; border-radius: 8px; }
.tabs { display: flex; gap: 2px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
.tabs button { flex: 1 0 auto; background: transparent; border: 0; color: color-mix(in srgb, var(--bar-fg) 72%, transparent);
  padding: 10px 12px 9px; font-size: 15px; font-weight: 600; border-bottom: 4px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--bar-fg); border-bottom-color: var(--brand); }

main { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 12px; display: grid; gap: 12px; max-width: 760px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.card > h2, .card > summary h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 600px) { .grid2.l3 { grid-template-columns: repeat(3, 1fr); } }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f > span b { color: var(--bad); }
input.i, select.i, textarea.i { width: 100%; min-height: 48px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card);
  padding: 8px 10px; font-size: 18px; color: var(--fg); }
input.i.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
input.i:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
textarea.i { min-height: 64px; font-size: 16px; }
.un { font-size: 12px; color: var(--muted); }

.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 48px; border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; font-size: 17px; font-weight: 700; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--bar); color: var(--bar-fg); border-color: var(--bar); box-shadow: inset 0 -4px 0 var(--brand); }
.seg-l { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

.b { min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 17px; font-weight: 700; padding: 0 16px; color: var(--fg); }
.b.p { background: var(--brand); border-color: var(--brand); color: #1c1d1a; }
.b.d { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.b.s { min-height: 40px; font-size: 15px; padding: 0 12px; }
.b:disabled { opacity: .45; }
.linha { display: flex; gap: 8px; flex-wrap: wrap; }
.linha > .b { flex: 1 1 auto; }

.vivo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vivo div { background: var(--soft); border-radius: 8px; padding: 8px; text-align: center; }
.vivo small { display: block; font-size: 12px; color: var(--muted); }
.vivo strong { font: 700 22px var(--f-num); font-variant-numeric: tabular-nums; }
.conf { display: inline-grid; place-items: center; min-width: 44px; height: 32px; padding: 0 8px; border-radius: 16px; font-weight: 800; font-size: 16px; }
.conf.S { background: var(--ok-bg); color: var(--ok); }
.conf.N { background: var(--bad-bg); color: var(--bad); }
.conf.x { background: var(--soft); color: var(--muted); }
.vivo .S strong { color: var(--ok); } .vivo .N strong { color: var(--bad); }
.vivo div.S { background: var(--ok-bg); } .vivo div.N { background: var(--bad-bg); }

.aviso { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.info { color: var(--muted); font-size: 14px; margin: 0; }

.lista { display: grid; gap: 0; border-top: 1px solid var(--line); }
.it { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line);
  background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; color: var(--fg); }
.it .n { font: 700 15px var(--f-num); color: var(--muted); }
.it .t { min-width: 0; }
.it .t b { display: block; font-size: 16px; }
.it .t span { font-size: 13px; color: var(--muted); font-family: var(--f-num); }
.it.ed { background: var(--soft); }

.rel { display: grid; gap: 4px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--fg); }
.rel b { font-size: 18px; }
.rel span { font-size: 14px; color: var(--muted); }
.rel-l { position: relative; display: grid; gap: 6px; }
.rel-l .rel { padding-right: 92px; }
.lixo { position: absolute; top: 8px; right: 8px; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1.5px solid color-mix(in srgb, var(--bad) 45%, var(--line));
  background: var(--card); color: var(--bad); font-weight: 700; font-size: 14px; }
.hora { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: end; }
.hora .b { min-height: 48px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 2px 8px; background: var(--soft); color: var(--muted); margin-right: 4px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }

/* carga em placa */
.fases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.fases button { min-height: 54px; border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; font-size: 13px; font-weight: 700; line-height: 1.15; padding: 4px; color: var(--fg); }
.fases button small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.fases button[aria-pressed="true"] { background: var(--bar); color: var(--bar-fg); border-color: var(--bar); box-shadow: inset 0 -4px 0 var(--brand); }
.fases button[aria-pressed="true"] small { color: color-mix(in srgb, var(--bar-fg) 70%, transparent); }
.fases button.feito:not([aria-pressed="true"]) { border-color: var(--ok); }
.carga { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; background: var(--soft); border-radius: 10px; padding: 12px; }
.carga .q { font: 800 40px/1 var(--f-num); font-variant-numeric: tabular-nums; }
.carga .q small { font-size: 18px; font-weight: 700; }
.carga .s { font-size: 14px; color: var(--muted); }
.crono { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.crono .rel-t { font: 800 44px/1 var(--f-num); font-variant-numeric: tabular-nums; }
.crono .prox { font-size: 14px; color: var(--muted); }
.tab-wrap { overflow-x: auto; margin: 0 -4px; }
table.lt { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.lt th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding: 4px; }
table.lt td { padding: 3px 4px; text-align: center; font-family: var(--f-num); }
table.lt td.tm { font-weight: 700; color: var(--muted); white-space: nowrap; }
table.lt input { width: 100%; min-width: 74px; min-height: 46px; text-align: center; font: 600 19px var(--f-num); border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); padding: 4px; }
table.lt input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
table.lt tr.min td.tm { color: var(--fg); }
table.lt tr.agora td { background: color-mix(in srgb, var(--brand) 28%, transparent); }
table.lt tr.agora td:first-child { border-radius: 8px 0 0 8px; } table.lt tr.agora td:last-child { border-radius: 0 8px 8px 0; }
.dm { font-size: 15px; } .dd { font-size: 13px; color: var(--muted); }

.rodape { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bar); color: var(--bar-fg);
  border-top: 3px solid var(--brand); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rodape-in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding-block: 8px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); max-width: 760px; margin: 0 auto; }
.rodape-in div { text-align: center; min-width: 0; }
.rodape small { display: block; font-size: 11px; color: color-mix(in srgb, var(--bar-fg) 65%, transparent); }
.rodape strong { font: 700 18px var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }

.conf-del { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-bg); color: var(--bad); padding: 10px; border-radius: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 40; background: var(--bar); color: var(--bar-fg);
  border-radius: 10px; padding: 10px 16px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
details.card > summary { cursor: pointer; list-style-position: inside; color: var(--muted); }
details.mais > summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
pre.reg { font: 15px/1.45 var(--f-ui); white-space: pre-wrap; background: var(--soft); padding: 10px; border-radius: 8px; margin: 0; }
a.b { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
a.b.wa { background: #25d366; border-color: #25d366; color: #0b2e17; }
label.chk { display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 44px; }
label.chk input { width: 24px; height: 24px; accent-color: var(--brand); }
pre.json { font: 12px/1.35 var(--f-num); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; background: var(--soft); padding: 8px; border-radius: 8px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: sobe .18s ease-out; } @keyframes sobe { from { transform: translate(-50%, 10px); opacity: 0; } } }
</style>

<header class="topo">
  <div class="topo-in">
    <button class="btn-topo" id="voltar" aria-label="Voltar" hidden>‹</button>
    <h1 id="titulo"><span class="marca">argon<b>via</b></span> campo</h1>

<script id="calc">
/* ===== cálculos — os mesmos do programa Argonvia ensaios (modulos/in_situ/calculos.py) ===== */
var PASSO = 15;   /* NF P 94-117-1: leituras de 15 em 15 s, até 10 min por fase */
var TEMPOS = []; for (var _t = 0; _t <= 600; _t += PASSO) TEMPOS.push(_t);
var FASES = ["1.ª carga", "1.ª descarga", "2.ª carga", "2.ª descarga"];

function num(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  var t = String(v).trim().replace(/\s/g, "").replace(",", ".");
  if (t === "" || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return null;
  var n = Number(t);
  return isFinite(n) ? n : null;
}
/* ROUND do Excel: metade para longe do zero, sobre a representação decimal */
function xr(x, c) {
  if (x === null || x === undefined || !isFinite(x)) return null;
  var s = x < 0 ? -1 : 1, a = Math.abs(x);
  var r = Number(Math.round(Number(a + "e" + c)) + "e-" + c);
  return r === 0 ? 0 : s * r;
}
function txt(v) { return v === null || v === undefined ? "" : String(v).trim(); }

/* L084 gamadensímetro: w = (γh − γd)/γd × 100 ; CR = γd/γmáx × 100 ; «S» se CR > exigida */
function calcGama(cab, testes) {
  var req = num(cab.grau_exigido), out = [], n = 0;
  (testes || []).forEach(function (t) {
    var gh = num(t.gh), gd = num(t.gd);
    var gmax = num(t.gmax); if (gmax === null) gmax = num(cab.gmax);
    var wop = num(t.wop); if (wop === null) wop = num(cab.wop);
    var r = { n: null, w: null, CR: null, conf: "", gmax: gmax, wop: wop };
    if (gd) {
      r.n = ++n;
      if (gh !== null) r.w = (gh - gd) / gd * 100;
      if (gmax) r.CR = gd / gmax * 100;
      r.conf = r.CR === null ? "" : (req === null || r.CR > req ? "S" : "N");
    }
    out.push(r);
  });
  return out;
}

function areaPlaca(diam) { return xr(Math.PI * Math.pow(diam / 2, 2) / 10, 0); }
function cargaKN(sigma, area) { return xr(sigma * 0.010197 / 10.2 * area, 0); }
function nDef(p) { var n = num(p.deflectometros); return n === 1 || n === 2 || n === 3 ? n : 1; }

/* L401 carga em placa NF P 94-117-1 */
function calcPlaca(p) {
  var diam = num(p.placa) || 60;
  var nu = num(p.poisson); if (nu === null) nu = 0.25;
  var s1 = num(p.sigma1), s2 = num(p.sigma2);
  var area = areaPlaca(diam), nd = nDef(p);
  var ini = [0, 1, 2].map(function (k) { return num((p.ini || [])[k]) || 0; });
  var dm = TEMPOS.map(function (_, i) {
    var o = {};
    for (var f = 0; f < 4; f++) {
      var vals = [];
      for (var k = 0; k < nd; k++) {
        var v = num((((p.L || {})["d" + (k + 1)] || [])[i] || {})["f" + f]);
        if (v !== null) vals.push(Math.abs(v - ini[k]));
      }
      o["f" + f] = vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
    }
    return o;
  });
  var fases = [0, 1, 2, 3].map(function (f) {
    var usados = [];
    TEMPOS.forEach(function (t, i) { if (dm[i]["f" + f] !== null) usados.push([t, dm[i]["f" + f]]); });
    var ten = [s1, 0, s2, 0][f];
    return { nome: FASES[f], tensao: ten, carga: ten === null ? null : cargaKN(ten, area),
      dmi: usados.length ? usados[0][1] : null, dmf: usados.length ? usados[usados.length - 1][1] : null,
      t_final: usados.length ? usados[usados.length - 1][0] : null,
      variacao: usados.length >= 2 ? usados[usados.length - 1][1] - usados[usados.length - 2][1] : null };
  });
  var W1 = fases[0].dmf;
  var W2 = fases[2].dmf !== null && fases[1].dmf !== null ? fases[2].dmf - fases[1].dmf : null;
  var fator = Math.PI / 4 * (1 - nu * nu);
  var ev1 = W1 !== null && s1 !== null && W1 ? xr(fator * ((s1 / 1000) * diam * 10) / W1, 1) : null;
  var ev2 = W2 !== null && s2 !== null && W2 ? xr(fator * ((s2 / 1000) * diam * 10) / W2, 1) : null;
  return { area: area, dm: dm, fases: fases, W1: W1, W2: W2, Ev1: ev1, Ev2: ev2,
    k: ev1 !== null && ev2 !== null && ev1 ? xr(ev2 / ev1, 2) : null };
}
</script>

<script>
/* ===== estado ===== */
var CHAVE = "argonvia-campo-v1";
var S = carregar();
var UI = { vista: "lista", rel: null, tab: "dados", ecp: null, edTeste: null, apagar: null };
var crono = null, audio = null, wake = null, ultimoBip = -1;

function carregar() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(CHAVE) || "null"); } catch (e) {}
  if (!s || !s.rels) s = { v: 2, rels: [], ultimoCab: null, operador: "" };
  /* 1.ª versão: leituras da placa de minuto a minuto (11 linhas) → linhas de 15 s */
  s.rels.forEach(function (r) {
    r.placas.forEach(function (p) {
      if (p.passo === PASSO) return;
      ["d1", "d2", "d3"].forEach(function (k) {
        var g = (p.L || {})[k] || [], n = vazia();
        g.slice(0, 11).forEach(function (row, i) { if (row) n[i * 4] = row; });
        p.L[k] = n;
      });
      p.passo = PASSO;
    });
  });
  return s;
}
var tGravar = null;
function gravar() {
  clearTimeout(tGravar);
  tGravar = setTimeout(function () { try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) { toast("Não foi possível gravar no telemóvel: " + e.message); } }, 150);
}
function gravarJa() { clearTimeout(tGravar); try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {} }
window.addEventListener("pagehide", gravarJa);
document.addEventListener("visibilitychange", function () { if (document.hidden) gravarJa(); else if (crono) pedirWake(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

function hoje() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function rel() { return S.rels.find(function (r) { return r.id === UI.rel; }); }
function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function F(v, c) { if (v === null || v === undefined || !isFinite(v)) return "—"; return xr(v, c).toFixed(c).replace(".", ","); }
function pk(v) {
  var s = txt(v); if (!s || s.indexOf("+") >= 0) return s;
  var n = num(s); if (n === null) return s;
  var km = Math.floor(n / 1000), r = n - km * 1000;

  var rl = app.querySelector('[data-o="relogio"]'); if (rl) rl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  var px = app.querySelector('[data-o="prox"]');
  if (px) px.textContent = s >= 600 ? "10:00 — fim do tempo da fase" : "Ler agora a dos " + mmss(TEMPOS[i]) + " · próxima em " + (PASSO - (s % PASSO)) + " s";
  var tr = app.querySelector('.lt tbody tr[data-i="' + i + '"]'); if (tr) tr.classList.add("agora");
  if (i !== ultimoBip) {
    var primeiro = ultimoBip === -1 && s > 3;
    ultimoBip = i;
    if (!primeiro) {
      bip(TEMPOS[i] % 60 === 0);
      var inp = tr && tr.querySelector("input");
      if (inp && !inp.value) { inp.focus({ preventScroll: true }); tr.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
  }
  if (s > 615) { p.t0 = null; gravar(); pararCrono(); tickCrono(); }
}

/* ---------- ações ---------- */
function acao(a, x, el) {
  var r = rel();
  switch (a) {
    case "novoRel": var n = novoRel(); UI.rel = n.id; UI.vista = "rel"; UI.tab = "dados"; render(); setTimeout(function () { var i = $("#c_r_relatorio"); i && i.focus(); }, 50); break;
    case "abrirRel": UI.rel = x; UI.vista = "rel"; UI.tab = "dados"; UI.edTeste = null; render(); break;
    case "tab": UI.tab = x; render(); window.scrollTo(0, 0); break;
    case "apagarRel": UI.apagar = "rel"; render(); break;
    case "apagarRelSim": S.rels = S.rels.filter(function (q) { return q.id !== r.id; }); UI.vista = "lista"; UI.rel = null; UI.apagar = null; gravar(); render(); toast("Relatório apagado"); break;
    case "cancelar": UI.apagar = null; render(); break;
    case "guardarTeste":
      /* o que está escrito nos campos é o que conta (mesmo que o telemóvel ainda não tenha avisado a página) */
      app.querySelectorAll('#form-teste [data-p^="t."]').forEach(function (el) { TESTE[el.getAttribute("data-p").slice(2)] = el.value; });
      if (num(TESTE.gd) === null && num(TESTE.gh) === null) { toast("Escreva γh e γd"); var q = $("#c_t_gh"); q && q.focus(); return; }
      var t = JSON.parse(JSON.stringify(TESTE));
      if (UI.edTeste !== null && UI.edTeste >= 0) { t.hora = r.gama.testes[UI.edTeste].hora; r.gama.testes[UI.edTeste] = t; toast("Teste " + (UI.edTeste + 1) + " corrigido"); }
      else { t.hora = Date.now(); atividade(r); r.gama.testes.push(t); var cr = calcGama(r.gama.cab, r.gama.testes)[r.gama.testes.length - 1]; toast("Teste " + r.gama.testes.length + " guardado · CR " + F(cr.CR, 1) + "% · " + (cr.conf || "—")); }
      S.ultimoCab = JSON.parse(JSON.stringify(r.gama.cab)); S.ultimaObra = r.obra; if (txt(r.operador)) S.operador = r.operador;
      UI.edTeste = null; UI.apagar = null; r.mod = Date.now(); gravar(); render();
      var ipk = $("#c_t_pk"); if (ipk) { $("#form-teste").scrollIntoView({ block: "start" }); ipk.focus(); }
      break;
    case "editarTeste": UI.edTeste = Number(x); TESTE = JSON.parse(JSON.stringify(r.gama.testes[UI.edTeste])); UI.apagar = null; render(); $("#form-teste").scrollIntoView({ block: "start" }); break;
    case "cancelarTeste": UI.edTeste = null; UI.apagar = null; render(); break;
    case "apagarTeste": UI.apagar = "teste"; render(); break;
    case "apagarTesteSim": r.gama.testes.splice(UI.edTeste, 1); UI.edTeste = null; UI.apagar = null; gravar(); render(); toast("Teste apagado"); break;
    case "novaPlaca": novaPlaca(r); UI.ecp = r.placas.length - 1; UI.vista = "ecp"; ultimoBip = -1; render(); window.scrollTo(0, 0); break;
    case "abrirECP": UI.ecp = Number(x); UI.vista = "ecp"; ultimoBip = -1; render(); window.scrollTo(0, 0); if (r.placas[UI.ecp].t0) iniciarIntervalo(); break;
    case "fase": var p = r.placas[UI.ecp]; if (p.t0 && p.t0f !== Number(x)) { p.t0 = null; pararCrono(); } p.fase = Number(x); ultimoBip = -1; gravar(); render(); break;
    case "crono":
      var pp = r.placas[UI.ecp];
      if (pp.t0 && pp.t0f === (pp.fase || 0)) { pp.t0 = null; pararCrono(); }
      else { pp.t0 = Date.now(); pp.t0f = pp.fase || 0; ultimoBip = -1; atividade(r, pp); horasECP(); iniciarIntervalo(); pedirWake(); }
      gravar(); tickCrono(); break;
    case "fimECP": pararCrono(); r.placas[UI.ecp].t0 = null; atividade(r, r.placas[UI.ecp]); gravar(); UI.vista = "rel"; UI.tab = "placa"; render(); window.scrollTo(0, 0); toast("Ensaio guardado"); break;
    case "apagarECP": UI.apagar = "ecp"; render(); break;
    case "apagarECPSim": pararCrono(); r.placas.splice(UI.ecp, 1); UI.vista = "rel"; UI.tab = "placa"; UI.apagar = null; gravar(); render(); toast("Ensaio apagado"); break;
    case "agora":
      definir(x, agoraHM()); if (x === "r.hora_fim") r.hora_fim_manual = true; if (x === "p.hora_fim") r.placas[UI.ecp].hora_fim_manual = true;
      var ci = document.getElementById("c_" + x.replace(/[^\w]/g, "_")); if (ci) ci.value = agoraHM();
      refrescarRegisto();
      break;
    case "apagarLista": UI.apagarId = x; render(); break;
    case "apagarListaNao": UI.apagarId = null; render(); break;
    case "apagarListaSim": S.rels = S.rels.filter(function (q) { return q.id !== x; }); UI.apagarId = null; gravar(); render(); toast("Relatório apagado"); break;
    case "regWA": reg(r).aberto = Date.now(); gravar(); setTimeout(refrescarRegisto, 50); return;
    case "regPartilhar":
      var tx = textoRegisto();
      if (navigator.share) navigator.share({ title: "Registo de trabalho — relatório " + txt(r.relatorio), text: tx }).then(function () { reg(r).aberto = Date.now(); gravar(); refrescarRegisto(); }).catch(function () {});
      else copiar(tx);
      break;
    case "regCopiar": copiar(textoRegisto()); break;
    case "partilhar": partilhar(r, true); break;
    case "descarregar": partilhar(r, false); break;
    case "copiar": copiar(JSON.stringify(exportar(r))); break;
  }
}
function copiar(s) {
  try { navigator.clipboard.writeText(s).then(function () { toast("Copiado — cole no WhatsApp ou no email"); }, function () { selecionar(); }); } catch (e) { selecionar(); }
}
function selecionar() { var pre = $("pre.json") || $("pre.reg"); if (!pre) return; var rg = document.createRange(); rg.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast("Texto selecionado — copie-o"); }
function iniciarIntervalo() { if (crono) clearInterval(crono); crono = setInterval(tickCrono, 250); }
/* O Android só deixa partilhar alguns tipos de ficheiro (texto, PDF, imagens…) e não aceita .json: por isso o
   ficheiro vai como texto (.txt), com o mesmo conteúdo; o Argonvia ensaios reconhece-o pelo conteúdo. */
function partilhar(r, share) {
  var e = exportar(r), nome = nomeFicheiro(r), texto = JSON.stringify(e, null, 1);
  var blob = new Blob([texto], { type: "text/plain" });
  var marcar = function () { r.exportado = Date.now(); gravar(); render(); };
  if (share) {
    if (!navigator.share || !window.isSecureContext) {
      descarregar(blob, nome, marcar);
      toast("Este endereço não permite partilhar (só https). Ficheiro guardado em Transferências.");
      return;
    }
    var file = null;
    try { file = new File([blob], nome, { type: "text/plain" }); } catch (err) {}
    if (file && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
      navigator.share({ files: [file] }).then(marcar).catch(function (err) {
        if (err && err.name === "AbortError") return;           /* o técnico cancelou */
        descarregar(blob, nome, marcar);
        toast("Não deu para partilhar (" + (err && err.name || "erro") + "). Ficheiro guardado em Transferências.");
      });
      return;
    }
    descarregar(blob, nome, marcar);
    toast("Este telemóvel não partilha ficheiros pelo browser. Ficheiro guardado em Transferências.");
    return;
  }
  descarregar(blob, nome, marcar);
}
function descarregar(blob, nome, depois) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Guardado em Transferências: " + nome); depois && depois();
}

render();
if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
